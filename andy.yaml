# Andy: charcoal panels with a lime accent.
#
# One file themes the CLI, TUI and desktop. Hermes reads it from
# ~/.hermes/skins/andy.yaml (symlinked to this file). Activate with `/skin andy`
# or `display.skin: andy` in config.yaml.
#
# The desktop builds a rough palette from `colors`, then `customCSS` pins the
# exact surfaces. The skin is dark only: the desktop's light/dark toggle keeps
# this palette.

name: andy
description: Charcoal panels, neutral grays, lime accent

colors:
  # Surfaces
  background: "#1b1b1b"        # main panel
  status_bar_bg: "#262626"     # window frame
  completion_menu_bg: "#262626"

  # Text
  ui_text: "#ededed"
  banner_text: "#ededed"
  banner_title: "#ededed"
  banner_dim: "#9e9e9e"
  status_bar_text: "#ededed"
  prompt: "#ededed"

  # Accent
  ui_accent: "#dff36f"
  banner_accent: "#dff36f"
  input_rule: "#dff36f"
  response_border: "#3a3a3a"

  # Lines
  ui_border: "#2e2e2e"
  banner_border: "#2e2e2e"
  session_border: "#3a3a3a"
  session_label: "#b4b4b4"

  # Status
  ui_ok: "#7bd88f"
  ui_warn: "#f2c94c"
  ui_error: "#f26b6b"
  status_bar_good: "#7bd88f"
  status_bar_warn: "#f2c94c"
  status_bar_critical: "#f26b6b"

customCSS: |
  /* ── Tokens ─────────────────────────────────────────────────────────
     Unlayered, so these beat the app's base layer. Seeds that the app
     writes inline on <html> need !important. */
  :root:root {
    --andy-frame: #262626;     /* titlebar, sidebar, window edge */
    --andy-panel: #1b1b1b;     /* main content panel */
    --andy-raised: #2c2c2c;    /* popovers, menus, raised controls */
    --andy-field: #2e2e2e;     /* search and text fields; 5.1:1 for placeholder */
    --andy-field-hover: #333333;
    --andy-hover: #2a2a2a;
    --andy-active: #333333;
    --andy-line: #2e2e2e;
    --andy-line-strong: #3a3a3a;
    --andy-text: #ededed;      /* 14.7:1 on panel */
    --andy-text-2: #b4b4b4;    /*  8.3:1 on panel */
    --andy-text-3: #9e9e9e;    /*  4.7:1 or better on every surface */
    --andy-text-4: #919191;    /*  4.6:1 on frame, 5.4:1 on panel */
    --andy-lime: #dff36f;
    --andy-lime-hover: #e8f78f;
    --andy-lime-ink: #1a1a1a;  /* 14.2:1 on lime */
    --andy-ring-quiet: #6b6b6b; /* 3.2:1, composer outline */
    --andy-pill: #f2f2f2;      /* active segment */
    --andy-pill-ink: #1a1a1a;

    /* Neutral grays everywhere: drop the accent tint from fills and lines */
    --theme-fill-primary-accent-mix: 0%;
    --theme-fill-secondary-accent-mix: 0%;
    --theme-fill-tertiary-accent-mix: 0%;
    --theme-fill-quaternary-accent-mix: 0%;
    --theme-fill-quinary-accent-mix: 0%;
    --theme-stroke-primary-accent-mix: 0%;
    --theme-stroke-secondary-accent-mix: 0%;
    --theme-stroke-tertiary-accent-mix: 0%;
    --theme-stroke-quaternary-accent-mix: 0%;
    --theme-row-hover-accent-mix: 0%;
    --theme-row-active-accent-mix: 0%;
    --theme-control-hover-accent-mix: 0%;
    --theme-control-active-accent-mix: 0%;

    /* Surfaces */
    --ui-bg-chrome: var(--andy-frame);
    --ui-bg-sidebar: var(--andy-frame);
    --ui-bg-editor: var(--andy-panel);
    --ui-bg-elevated: var(--andy-raised);
    --ui-bg-input: var(--andy-field);
    --ui-chat-surface-background: var(--andy-panel);
    --ui-sidebar-surface-background: var(--andy-frame);
    --ui-editor-surface-background: var(--andy-panel);
    --ui-widget-surface-background: var(--andy-frame);
    --ui-chat-bubble-background: var(--andy-raised);
    --ui-chat-bubble-opaque-background: var(--andy-raised);
    --ui-row-hover-background: var(--andy-hover);
    --ui-row-active-background: var(--andy-active);
    --ui-control-hover-background: var(--andy-hover);
    --ui-control-active-background: var(--andy-active);
    --chrome-action-hover: var(--andy-hover);

    /* Text */
    --ui-text-primary: var(--andy-text);
    --ui-text-secondary: var(--andy-text-2);
    --ui-text-tertiary: var(--andy-text-3);
    --ui-text-quaternary: var(--andy-text-4);

    /* Lines */
    --ui-stroke-primary: var(--andy-line-strong);
    --ui-stroke-secondary: var(--andy-line);
    --ui-stroke-tertiary: var(--andy-line);
    --sidebar-edge-border: transparent;

    /* shadcn tokens */
    --dt-card: var(--andy-panel);
    --dt-popover: var(--andy-raised);
    --dt-muted: var(--andy-frame);
    --dt-secondary: var(--andy-active);
    --dt-accent: var(--andy-active);
    --dt-sidebar-bg: var(--andy-frame);
    --dt-input-bg: 100%;
    --dt-input-border: 0%;
    --dt-input-inset: none;
    --dt-scrollbar-thumb: #4a4a4a;
    --ui-selection-background: color-mix(in srgb, var(--andy-lime) 28%, transparent);
    --ui-inline-code-background: #2a2a2a;

    /* 8px corners on panels and fields (default scalar is 0.2) */
    --radius-scalar: 0.8;
  }

  /* Lime stays the brand stroke: focus rings, cursors, the primary button.
     The composer ring stays neutral like the reference. */
  :root:root {
    --theme-primary: var(--andy-lime) !important;
    --theme-midground: var(--andy-lime) !important;
    --dt-primary-foreground: var(--andy-lime-ink) !important;
    --dt-midground-foreground: var(--andy-lime-ink) !important;
    --dt-composer-ring: var(--andy-ring-quiet) !important;
    --dt-border: var(--andy-line) !important;
    --dt-sidebar-border: var(--andy-line) !important;
    --dt-muted: var(--andy-frame) !important;
  }

  /* ── Frame ──────────────────────────────────────────────────────────── */
  body {
    background: var(--andy-frame);
  }

  /* ── Chat column: 1280px max, centered. The transcript and the
     composer both read this one variable. */
  :root:root {
    --composer-width: 1280px;
  }

  /* ── Pane tabs, shared ───────────────────────────────────────────────
     Sentence case, no separators, no blue. */
  :root:root {
    --pane-tab-active-accent: var(--andy-text);
    --pane-tab-strip-bg: var(--andy-frame);
    --pane-tab-active-bg: var(--andy-panel);
  }

  [data-slot="pane-tab"] {
    font-size: 0.8125rem;
    border-left-width: 0;
  }

  [data-slot="pane-tab"] .uppercase {
    text-transform: none;
    letter-spacing: normal;
  }

  [data-slot="pane-tab"][data-active="false"] {
    color: var(--andy-text-3);
  }

  [data-slot="pane-tab"][data-active="false"]:hover {
    color: var(--andy-text);
  }

  /* ── Titlebar tabs: browser-style, like the reference ────────────────
     The active tab is a panel-colored tab with rounded top corners that
     flows into the content below. Inactive tabs sit on the frame. */
  [class*="group/pane-header"][class*="app-region:drag"] {
    --pane-tab-active-bg: var(--andy-panel);
    --pane-tab-strip-bg: transparent;
    --pane-tab-active-accent: transparent;
    padding-top: 8px;
  }

  [class*="group/pane-header"][class*="app-region:drag"] [role="tablist"] {
    gap: 4px;
  }

  [class*="group/pane-header"][class*="app-region:drag"] [data-slot="pane-tab"] {
    padding: 0 8px;
    border-radius: 8px 8px 0 0;
    box-shadow: none;
  }

  [class*="group/pane-header"][class*="app-region:drag"] [data-slot="pane-tab"][data-active="false"]:hover {
    --pane-tab-strip-bg: var(--andy-hover);
    box-shadow: none;
  }

  /* ── Sessions sidebar ────────────────────────────────────────────────
     Scoped to the sidebar's own zone so other panes keep their tabs. */
  [data-tour="sessions-sidebar"] {
    --ui-text-primary: #f5f5f5;    /* 13.9:1 on frame */
    --ui-text-secondary: #e6e6e6;  /* 12.1:1 */
    --ui-text-tertiary: #b8b8b8;   /*  7.6:1 */
  }

  /* Make room under the window buttons for the segmented tabs. */
  [data-tour="sessions-sidebar"] [data-slot="sidebar-content"] > [data-slot="sidebar-group"]:first-child {
    padding-top: calc(var(--titlebar-height) + 0.375rem + 16px);
  }

  /* Sessions / Bots: segmented pill. The strip is anchored to the bottom
     of the titlebar area, so it moves down 12px to clear the window
     buttons and the nav above moves down to match. */
  [data-tree-group]:has([data-tour="sessions-sidebar"]) [class*="group/pane-header"][class*="h-7"] {
    --pane-tab-strip-bg: transparent;
    --pane-tab-active-bg: var(--andy-line-strong);
    --pane-tab-active-accent: transparent;
    bottom: -12px;
    z-index: 20;               /* paint over the sidebar body it overlaps */
    height: 32px;
    margin: 0 10px;
    padding: 4px;
    background: var(--andy-panel);
    border-radius: 8px;
  }

  [data-tree-group]:has([data-tour="sessions-sidebar"]) [data-panel-header] {
    z-index: 20;
    overflow: visible;
  }

  [data-tree-group]:has([data-tour="sessions-sidebar"]) [class*="group/pane-header"][class*="h-7"] [role="tablist"] {
    gap: 4px;
  }

  [data-tree-group]:has([data-tour="sessions-sidebar"]) [class*="group/pane-header"][class*="h-7"] [data-slot="pane-tab"] {
    flex: 1 1 0;
    max-width: none;
    justify-content: center;
    border-radius: 6px;
    box-shadow: none;
  }

  [data-tree-group]:has([data-tour="sessions-sidebar"]) [class*="group/pane-header"][class*="h-7"] [data-slot="pane-tab"][data-active="false"]:hover {
    --pane-tab-strip-bg: var(--andy-hover);
    box-shadow: none;
  }

  /* Section labels (Pinned, Sessions): quiet gray, sentence case, no
     dithered dot. Matches the uppercase + 0.16em tracking pair. */
  .uppercase[class*="tracking-[0.16em]"] {
    color: var(--andy-text-3);
    text-transform: none;
    letter-spacing: normal;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .uppercase[class*="tracking-[0.16em]"] > .dither {
    display: none;
  }

  /* Date dividers (Earlier this week) read as children of Sessions:
     indented to the session titles, one step smaller. */
  .uppercase[class*="tracking-[0.12em]"] {
    padding-left: 12px;
    color: var(--andy-text-3);
    text-transform: none;
    letter-spacing: normal;
    font-size: 0.6875rem;
    font-weight: 500;
  }

  /* Pinned shows only when something is pinned: hide the section while
     its only content is the empty hint. */
  [data-session-pin-drop]:has(> [data-slot="sidebar-group-content"] > div:only-child > span > .codicon-pin) {
    display: none;
  }

  /* Search: a filled field, readable at rest. The stock field fades to
     30% opacity until focused. */
  [class*="opacity-30"][class*="focus-within:opacity-100"] {
    opacity: 1;
    width: 100%;
    height: 32px;
    margin-bottom: 8px;
    padding: 0 12px;
    gap: 8px;
    background: var(--andy-field);
    border: 0;
    border-radius: 8px;
  }

  [class*="opacity-30"][class*="focus-within:opacity-100"]:hover {
    background: var(--andy-field-hover);
  }

  [class*="opacity-30"][class*="focus-within:opacity-100"]:focus-within {
    outline: 2px solid var(--andy-lime);
    outline-offset: 2px;
  }

  [class*="opacity-30"][class*="focus-within:opacity-100"] > input:focus-visible {
    outline: none;
  }

  /* ── Tooltips: light text on the raised gray, matching arrow ───────── */
  [data-slot="tooltip-content"] {
    color: var(--andy-text);
    box-shadow: 0 0 0 1px var(--andy-line-strong);
  }

  [data-slot="tooltip-arrow"],
  [data-slot="tooltip-arrow"] path {
    fill: var(--andy-raised);
  }

  /* ── Chat: user message on a raised gray card, no outline ─────────── */
  :root:root {
    --dt-user-bubble-border: transparent !important;
  }

  /* ── Primary button: lime with dark ink ───────────────────────────── */
  [data-slot="button"][data-variant="default"] {
    background: var(--andy-lime);
    color: var(--andy-lime-ink);
    border-radius: 6px;
  }

  [data-slot="button"][data-variant="default"]:hover {
    background: var(--andy-lime-hover);
  }

  [data-slot="button"][data-variant="default"]:active {
    background: color-mix(in srgb, var(--andy-lime) 88%, #000);
  }

  [data-slot="button"]:not([data-variant="default"]) {
    border-radius: 6px;
  }

  /* ── Segmented tabs: dark track, light pill on the active segment ─── */
  [data-slot="tabs-list"] {
    background: var(--andy-frame);
    border-radius: 999px;
    padding: 4px;
  }

  [data-slot="tabs-trigger"] {
    border-radius: 999px;
    color: var(--andy-text-2);
    transition-property: background-color, color;
  }

  [data-slot="tabs-trigger"]:hover:not([data-state="active"]) {
    color: var(--andy-text);
    background: var(--andy-hover);
  }

  [data-slot="tabs-trigger"][data-state="active"] {
    background: var(--andy-pill);
    color: var(--andy-pill-ink);
    box-shadow: none;
  }

  /* ── Fields: filled, no border at rest ────────────────────────────── */
  [data-slot="input"],
  [data-slot="input-group"] {
    background: var(--andy-field);
    border-radius: 8px;
  }

  [data-slot="input"]::placeholder {
    color: var(--andy-text-3);
  }

  /* ── Menus and popovers ───────────────────────────────────────────── */
  [data-slot="dropdown-menu-content"],
  [data-slot="dropdown-menu-sub-content"],
  [data-slot="tooltip-content"],
  [data-slot="dialog-content"] {
    background: var(--andy-raised);
    border-color: var(--andy-line-strong);
    border-radius: 8px;
  }

  /* ── Focus: one visible lime ring on every control ────────────────── */
  :is(button, a, input, textarea, select, [role="tab"], [role="menuitem"], [tabindex]):focus-visible {
    outline: 2px solid var(--andy-lime);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    [data-slot="tabs-trigger"],
    [data-slot="button"] {
      transition: none;
    }
  }
