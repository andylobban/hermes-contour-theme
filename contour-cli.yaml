# Contour CLI: terminal colors for the Hermes CLI and TUI.
#
# Hermes reads this from ~/.hermes/skins/contour-cli.yaml when config.yaml
# sets `display.skin: contour-cli`.
#
# The desktop app uses plugin.js instead ("Contour" in Appearance),
# because only a plugin theme can carry separate light and dark palettes.

name: contour-cli
description: Charcoal panels, neutral grays, lime accent

colors:
  # Surfaces
  background: "#1b1b1b"        # main panel
  status_bar_bg: "#262626"     # window frame
  completion_menu_bg: "#262626"

  # Text
  ui_text: "#ededed"
  banner_text: "#ededed"
  banner_title: "#ededed"
  banner_dim: "#9e9e9e"
  status_bar_text: "#ededed"
  prompt: "#ededed"

  # Accent
  ui_accent: "#dff36f"
  banner_accent: "#dff36f"
  input_rule: "#dff36f"
  response_border: "#3a3a3a"

  # Lines
  ui_border: "#2e2e2e"
  banner_border: "#2e2e2e"
  session_border: "#3a3a3a"
  session_label: "#b4b4b4"

  # Status
  ui_ok: "#7bd88f"
  ui_warn: "#f2c94c"
  ui_error: "#f26b6b"
  status_bar_good: "#7bd88f"
  status_bar_warn: "#f2c94c"
  status_bar_critical: "#f26b6b"
